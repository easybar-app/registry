name: Sync widget releases

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@v7

      - name: Checkout widgets
        uses: actions/checkout@v7
        with:
          repository: easybar-app/widgets
          path: widgets-source

      - name: Synchronize published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make sync

      - name: Validate registry
        run: make check WIDGETS_DIR=widgets-source

      - name: Commit registry update
        run: |
          if git diff --quiet -- packages index.json; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages index.json
          git commit -m "chore(registry): sync widget releases"
          git push
